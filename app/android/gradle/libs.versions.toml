[versions]
agp = "8.13.2"
kotlin = "2.4.0"
composeBom = "2026.06.01"
activityCompose = "1.13.0"
lifecycle = "2.9.4"
coreKtx = "1.17.0"
navigation = "2.9.6"
dataStore = "1.2.0"
iroh = "1.1.0"
retrofit = "2.11.0"
okhttp = "4.12.0"
serialization = "1.9.0"
zxingEmbedded = "4.3.0"

junit = "4.13.2"
turbine = "1.2.1"
coroutinesTest = "1.11.0"
