check-edits:
  variations:
    t1: true
    c: false
  defaultRule:
    variation: t1
check-go-build:
  variations:
    t1: true
    c: false
  defaultRule:
    variation: c
info-needs:
  variations:
    t1: true
    c: false
  defaultRule:
    variation: c
disable-context-code-visibility-check:
  variations:
    t1: true
    c: false
  defaultRule:
    variation: t1
initial-repo-summary:
  variations:
    t1: true
    c: false
  defaultRule:
    variation: t1
manage-history-with-context-markers:
  variations:
    t1: true
    c: false
  defaultRule:
    variation: t1
disable-done-coding:
  variations:
    t1: true
    c: false
  defaultRule:
    variation: c
context-gathering-forget:
  variations:
    t1: true
    c: false
  defaultRule:
    variation: t1
review_chat_history_enabled:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: enabled
persistent_reviewer_history:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    percentage:
      enabled: 50
      disabled: 50
review_tool_result_max_chars:
  variations:
    default: 1000
  defaultRule:
    variation: default
review_help_result_max_chars:
  variations:
    default: 2000
  defaultRule:
    variation: default
review_recent_tool_results_count:
  variations:
    default: 20
  defaultRule:
    variation: default
review_chat_history_max_size:
  variations:
    default: 40000
  defaultRule:
    variation: default
review_context_types:
  version: "1"
  variations:
    withoutAutoReview: [EditBlockReport, TestResult, Summary]
    withAutoReview: [EditBlockReport, TestResult, AutoReviewFeedback, Summary]
  defaultRule:
    percentage:
      withoutAutoReview: 50
      withAutoReview: 50