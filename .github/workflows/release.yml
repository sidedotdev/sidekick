name: Release

permissions:
  contents: write

on:
  push:
    tags: ['v*']

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            os_name: macos
            arch: arm64
            usearch_jemalloc: 1
          - runner: ubuntu-latest
            os_name: linux
            arch: amd64
            usearch_jemalloc: 0
          - runner: ubuntu-24.04-arm
            os_name: linux
            arch: arm64
            usearch_jemalloc: 0
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Sidekick
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Cache USearch build
        id: cache-usearch
        uses: actions/cache@v4
        with:
          path: /tmp/usearch/build_release
          key: ${{ runner.os }}-${{ runner.arch }}-usearch-${{ hashFiles('.github/workflows/release.yml') }}

      - name: Build USearch
        id: build-usearch
        if: ${{ steps.cache-usearch.outputs.cache-hit != 'true' }}
        run: |
          git clone --depth 1 --recursive --branch v2.16.6 https://github.com/unum-cloud/usearch.git
          cd usearch
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          # Upstream hardcodes -march=native, which bakes the runner's ISA into
          # released binaries and makes them crash with SIGILL on any machine
          # with a smaller instruction set. Dropping it and using SimSIMD's
          # dynamic dispatch keeps SIMD acceleration while kernels are chosen
          # from CPU features at runtime.
          sed -i '/-march=native/d' CMakeLists.txt
          cmake -D CMAKE_BUILD_TYPE=Release -D CMAKE_CXX_FLAGS=-DSIMSIMD_DYNAMIC_DISPATCH=1 -D USEARCH_USE_FP16LIB=1 -D USEARCH_USE_OPENMP=0 -D USEARCH_USE_SIMSIMD=1 -D USEARCH_USE_JEMALLOC=${{ matrix.usearch_jemalloc }} -D USEARCH_BUILD_TEST_CPP=1 -D USEARCH_BUILD_BENCH_CPP=1 -D USEARCH_BUILD_LIB_C=1 -D USEARCH_BUILD_TEST_C=1 -D USEARCH_BUILD_SQLITE=0 -B build_release
          cmake --build build_release --config Release
          ./build_release/test_cpp
          ./build_release/test_c
        working-directory: /tmp

      - name: Copy USearch Library and Headers
        run: |
          cp /tmp/usearch/build_release/libusearch_static_c.a libusearch_c.a
          sudo mkdir -p /usr/local/include
          sudo cp /tmp/usearch/c/usearch.h /usr/local/include/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        run: |
          npm ci
          npm run test:unit -- --run
          npm run build
        working-directory: frontend

      - name: Build CLI
        id: build-cli
        env:
          CGO_ENABLED: 1
          CGO_LDFLAGS: "-L. libusearch_c.a -lstdc++ -lm"
        run: |
          # Extract version from git tag or use commit hash
          VERSION=""
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=$(git rev-parse --short HEAD)
          fi

          SIDE="side_${{ matrix.os_name }}_${{ matrix.arch }}_$VERSION"

          go build -ldflags="-X main.version=${VERSION#v} -X sidekick/common.agentVersion=${VERSION#v}" -o $SIDE sidekick/cli
          echo "SIDE=$SIDE" >> $GITHUB_OUTPUT

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ steps.build-cli.outputs.SIDE }}

  side-agent:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: macos-15
            os: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Sidekick
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod

      - name: Build side-agent binary
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          ldflags="-s -w"
          if [ "$GOOS" = linux ]; then
            ldflags="$ldflags -linkmode external -extldflags -static"
          fi
          go build -ldflags="$ldflags" -o "side-agent-${GOOS}-${GOARCH}" ./cmd/side-agent

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: side-agent-${{ matrix.os }}-${{ matrix.arch }}