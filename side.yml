mission: |
  Sidekick is an async-first coding agent optimized for professional software
  developers. The core mission of Sidekick is to make developers more productive
  as they work within large existing code bases. While operated and steered by
  developers, it does as much possible reliably without the human in the loop,
  before engaging them.

  We aspire to:

  1. Reduce the level of agent supervision required by developers to the bare
     minimum
  2. Give developers ways to automatically verify work done by Sidekick
  3. Let developers effectively specify just what matters to them: their core
     design intent, constraints and preferences

worktree_setup: |
  cd frontend && if ! command -v bun >/dev/null 2>&1; then
    echo "error: bun is not installed; skipping frontend setup" >&2
  else
    bun ci
  fi && touch dist/empty.txt

test_commands:
  - command: "go run ./scripts/affected_tests/ -test.timeout 120s ./..."
  - working_dir: "frontend"
    command: "bun run test:unit -- --no-color"
  - working_dir: "frontend"
    command: "bun run type-check"
  - working_dir: "frontend"
    command: "bun run lint:check"

integration_test_commands:
  - command: "SIDE_INTEGRATION_TEST=true go run ./scripts/affected_tests/ -test.timeout 240s ./..."
  - command: "go run ./scripts/lint_chat_history_append/"
  - command: "go run ./scripts/lint_track_callback/ ./..."
  - command: "SIDE_E2E_TEST=true go run ./scripts/affected_tests/ -test.timeout 295s ./..."

agent_config:
  coding:
    auto_iterations: 25
  coding_and_verification:
    auto_iterations: 27

command_permissions:
  auto_approve:
    - pattern: "gotestreport"
    - pattern: "go run ./scripts/affected_tests"
    - pattern: "docker build"
    - pattern: "docker logs"
    - pattern: "docker ps"
    - pattern: "openshell"
    - pattern: "devpod"
    - pattern: "(npm|bun) run type-check"
    - pattern: "bun type-check"
    - pattern: "(npm|bun) run lint:check"
    - pattern: "(npm|bun) run test:unit.*--run"
    - pattern: "bun test:unit.*--run"
    - pattern: "go run ./worker/replay"
    - pattern: "go run ./scripts/run_activity"
    - pattern: "go run ./scripts/lint_.*"
    - pattern: "playwright-cli"

openshell:
  from: "Dockerfile.openshell"

# Reverse-forward the host's read-only Temporal proxy (exposed by dev builds
# of `side start`) into devpod/openshell containers so integration tests that
# read workflow histories (e.g. workflow replay) can connect. The proxy only
# allows listing workflows and fetching histories, so the sandbox cannot
# mutate the host's Temporal state. The container port must avoid every default
# Sidekick port (8855 api, 18855 temporal, 21855 readonly proxy, 28855 nats) so
# an in-container `side start` can still bind its own services; in particular
# 28855 collides with the embedded NATS server and would make it fail to bind
# ("address already in use").
port_forwards:
  - host_port: 21855
    container_port: 31855

dev_run:
  supervisor:
    command: "./scripts/supervisor.go --ephemeral"
